<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理系统</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 20px; background: #f5f7fa; }
        h1 { text-align: center; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
        .form-group { flex: 1; min-width: 100px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .btn { padding: 8px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; color: white; }
        .btn-primary { background: #4CAF50; }
        .btn-primary:hover { background: #45a049; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: #f39c12; }
        .btn-warning:hover { background: #e67e22; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #4CAF50; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .error { color: red; text-align: center; padding: 10px; }
        .loading { text-align: center; color: #888; padding: 10px; }
        #editId { display: none; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    </style>
</head>
<body>
<h1>📋 学生管理系统</h1>

<!-- 新增/修改表单 -->
<div class="card">
    <h3 id="formTitle">➕ 新增学生</h3>
    <div class="form-row">
        <input type="hidden" id="editId">
        <div class="form-group">
            <label>姓名</label>
            <input type="text" id="nameInput" placeholder="请输入姓名">
        </div>
        <div class="form-group">
            <label>年龄</label>
            <input type="number" id="ageInput" placeholder="请输入年龄">
        </div>
        <div class="form-group">
            <label>成绩</label>
            <input type="number" step="0.1" id="scoreInput" placeholder="请输入成绩">
        </div>
        <div class="form-group">
            <label>性别</label>
            <input type="text" id="genderInput" placeholder="请输入性别">
        </div>
        <div class="form-group" style="flex: 0;">
            <button class="btn btn-primary" id="submitBtn" onclick="submitStudent()">提交</button>
            <button class="btn btn-warning" id="cancelBtn" onclick="cancelEdit()" style="display:none;">取消</button>
        </div>
    </div>
</div>

<!-- 数据表格 -->
<div class="card">
    <div class="action-bar">
        <span>📊 学生列表</span>
        <button class="btn btn-primary" onclick="loadStudents()">🔄 刷新</button>
    </div>
    <div id="result"><div class="loading">加载中...</div></div>
</div>

<script>
    const API = 'http://8.156.74.250:8081/students';

    function loadStudents() {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '<div class="loading">加载中...</div>';

        fetch(API)
            .then(res => res.json())
            .then(data => {
                if (data.code === 200 && data.data && data.data.length > 0) {
                    let html = `<table><tr><th>ID</th><th>姓名</th><th>年龄</th><th>成绩</th><th>性别</th><th>操作</th></tr>`;
                    data.data.forEach(s => {
                        html += `<tr>
                            <td>${s.id}</td>
                            <td>${s.name}</td>
                            <td>${s.age}</td>
                            <td>${s.score}</td>
                            <td>${s.gender || ''}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="editStudent(${s.id})">✏️</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteStudent(${s.id})">🗑️</button>
                            </td>
                        </tr>`;
                    });
                    html += `</table>`;
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<p class="error">暂无学生数据</p >`;
                }
            })
            .catch(err => {
                resultDiv.innerHTML = `<p class="error">请求失败：${err.message}</p >`;
            });
    }

    function submitStudent() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('nameInput').value.trim();
        const age = document.getElementById('ageInput').value;
        const score = document.getElementById('scoreInput').value;
        const gender = document.getElementById('genderInput').value.trim();

        if (!name) { alert('请输入姓名'); return; }
        if (!age || age <= 0) { alert('请输入有效年龄'); return; }
        if (score === '' || score < 0) { alert('请输入有效成绩'); return; }

        const student = { name, age: parseInt(age), score: parseFloat(score), gender };
        const url = id ? `${API}/${id}` : API;
        const method = id ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(student)
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                alert(id ? '✅ 修改成功！' : '✅ 新增成功！');
                clearForm();
                loadStudents();
            } else {
                alert('❌ 操作失败：' + data.message);
            }
        })
        .catch(err => {
            alert('❌ 请求失败：' + err.message);
        });
    }

    function editStudent(id) {
        fetch(`${API}/${id}`)
            .then(res => res.json())
            .then(data => {
                if (data.code === 200 && data.data) {
                    const s = data.data;
                    document.getElementById('editId').value = s.id;
                    document.getElementById('nameInput').value = s.name;
                    document.getElementById('ageInput').value = s.age;
                    document.getElementById('scoreInput').value = s.score;
                    document.getElementById('genderInput').value = s.gender || '';
                    document.getElementById('formTitle').textContent = '✏️ 修改学生';
                    document.getElementById('submitBtn').textContent = '更新';
                    document.getElementById('cancelBtn').style.display = 'inline-block';
                } else {
                    alert('❌ 获取学生信息失败');
                }
            })
            .catch(err => {
                alert('❌ 请求失败：' + err.message);
            });
    }

    function deleteStudent(id) {
        if (!confirm(`确定要删除 ID 为 ${id} 的学生吗？`)) return;
        fetch(`${API}/${id}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    alert('✅ 删除成功！');
                    loadStudents();
                } else {
                    alert('❌ 删除失败：' + data.message);
                }
            })
            .catch(err => {
                alert('❌ 请求失败：' + err.message);
            });
    }

    function cancelEdit() {
        clearForm();
    }

    function clearForm() {
        document.getElementById('editId').value = '';
        document.getElementById('nameInput').value = '';
        document.getElementById('ageInput').value = '';
        document.getElementById('scoreInput').value = '';
        document.getElementById('genderInput').value = '';
        document.getElementById('formTitle').textContent = '➕ 新增学生';
        document.getElementById('submitBtn').textContent = '提交';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    window.onload = function() {
        loadStudents();
    };
</script>
</body>
</html>
